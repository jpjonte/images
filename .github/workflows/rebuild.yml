name: Weekly base rebuild

# Rebuilds the php-family and playwright base images weekly so OS security
# patches (via the Dockerfiles' `apk upgrade` / `apt-get upgrade`) land
# without waiting for a code change. A single schedule lives here, so no
# cron-string disambiguation is needed — contrast build.yml, which owns the
# daily flutter check.

on:
  schedule:
    - cron: '0 4 * * 1'   # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  packages: write

jobs:
  php:
    uses: ./.github/workflows/_image.yml
    with:
      name: php
      version: '8.5'

  frankenphp:
    uses: ./.github/workflows/_image.yml
    with:
      name: frankenphp
      version: '8.5'

  php-8_6:
    uses: ./.github/workflows/_image.yml
    with:
      name: php
      version: '8.6'

  frankenphp-8_6:
    uses: ./.github/workflows/_image.yml
    with:
      name: frankenphp
      version: '8.6'

  playwright:
    uses: ./.github/workflows/_image.yml
    with:
      name: playwright
      version: '1.63'
